<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Information</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/user.css">
</head>
<body>

  <main class="wrap">
    <h1 class="title">👤 User Information</h1>

    <form class="form-box" id="userForm" novalidate>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Enter your name" autocomplete="name">

      <label for="age">Age</label>
      <input id="age" type="number" placeholder="Enter your age" min="10" max="100">

      <label for="education">Education</label>
      <input id="education" type="text" placeholder="Diploma / B.Tech / Degree">

      <p id="userError" class="error" style="display:none"></p>

      <div class="actions">
        <a href="info.html"><button class="back-btn" type="button">← Back</button></a>
        <button id="userNextBtn" class="next-btn" type="submit">Continue →</button>
      </div>
    </form>
  </main>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
