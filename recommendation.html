<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Recommendation</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/recommendation.css">
</head>
<body>

  <main class="wrap">
    <div class="user-card">
      <h2>👤 User Information</h2>
      <div class="user-grid">
        <p><b>Name:</b> <span id="displayName">-</span></p>
        <p><b>Age:</b> <span id="displayAge">-</span></p>
        <p><b>Education:</b> <span id="displayEducation">-</span></p>
      </div>
    </div>

    <div class="ai-form">
      <h1 class="title">🤖 AI Career Recommendation</h1>

      <label for="skillInput">Skills</label>
      <input id="skillInput" type="text" placeholder="Java, Python, React">

      <label for="educationInput">Education</label>
      <input id="educationInput" type="text" placeholder="Diploma / B.Tech">

      <div class="btn-row">
        <a href="user.html"><button id="recommendBackBtn" class="back-btn" type="button">← Back</button></a>
        <button id="submitBtn" class="submit-btn" type="button">🤖 Get Recommendation</button>
        <button id="copyBtn" class="copy-btn" type="button">📋 Copy All</button>
      </div>
    </div>

    <div id="output"></div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
